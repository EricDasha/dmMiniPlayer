name: Build and release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的现有 tag，例如 v0.6.61'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  extension:
    name: Build extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          [[ "$TAG_VERSION" == "$VERSION" || "$TAG_VERSION" == "$VERSION-"* || "$TAG_VERSION" == "$VERSION+"* ]] || {
            echo "::error::tag $RELEASE_TAG does not match package.json version $VERSION"
            exit 1
          }

      - name: Build extension
        run: pnpm build

      - name: Archive extension
        run: pnpm archive

      - name: Generate release notes
        run: node scripts/getChangeLog.mjs > CHANGELOG.txt

      - name: Stage extension assets
        shell: bash
        run: |
          mkdir -p release
          cp build/chrome-mv3-prod-*.zip release/
          cp CHANGELOG.txt release/

      - name: Upload extension assets
        uses: actions/upload-artifact@v4
        with:
          name: extension-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  native-windows:
    name: Build Windows Native Host
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Native Host and installer
        shell: pwsh
        run: .\scripts\build-native-opacity-tools.ps1

      - name: Package Windows native tools
        shell: pwsh
        run: |
          $name = "dmMiniPlayer-native-windows-$env:RELEASE_TAG"
          $package = Join-Path release $name
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item build\native\dmmp-window-opacity-host.exe $package
          Copy-Item build\native\dmmp-window-opacity-installer.exe $package
          Copy-Item docs\native-window-opacity.md $package
          Copy-Item readme.md,LICENSE $package
          Compress-Archive -Path "$package\*" -DestinationPath "release\$name.zip" -CompressionLevel Optimal
          Remove-Item -LiteralPath $package -Recurse -Force

      - name: Upload Windows native assets
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-release
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [extension, native-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f -name '*.zip' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-assets/CHANGELOG.txt
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
